<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title data-i18n="ui.codex_continuer_keep_work_moving">Codex Continuer · 让工作持续向前</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Codex Continuer 首页" data-i18n-aria-label="ui.codex_continuer_home"><span class="brand-mark">c<span>↗</span></span><span>Continuer<small>FOR CODEX</small></span></a>
    <div class="nav-label" data-i18n="ui.workspace">工作空间</div>
    <nav id="nav">
      <button data-page="overview" class="active" data-i18n="ui.overview"><span data-icon="overview"></span>概览</button>
      <button data-page="tasks" data-i18n="ui.work"><span data-icon="tasks"></span>工作任务<span id="nav-count" class="count">0</span></button>
      <button data-page="quota" data-i18n="ui.quota_monitor"><span data-icon="chart"></span>额度监测</button>
      <button data-page="logs" data-i18n="ui.activity_log"><span data-icon="logs"></span>活动日志</button>
      <div class="nav-label second" data-i18n="ui.preferences">偏好设置</div>
      <button data-page="settings" data-i18n="ui.settings"><span data-icon="settings"></span>设置</button>
    </nav>
    <div class="sidebar-bottom"><div class="local-card"><span class="status-dot"></span><div data-i18n="ui.local_workspace">本地工作空间<small data-i18n="ui.data_stays_on_this_device">数据保存在此设备</small></div><span data-icon="shield"></span></div><div class="version"><span>Continuer</span><span id="app-version" data-i18n="ui.loading_version">读取版本…</span></div></div>
  </aside>
  <div class="workspace">
    <header><div class="breadcrumb" data-i18n="ui.workspace">工作空间<span>/</span><b id="breadcrumb-current" data-i18n="ui.overview">概览</b></div><div class="header-actions"><span id="connection" class="connection" data-i18n="ui.connecting">正在连接</span><select id="language" aria-label="切换语言" title="切换语言" data-i18n-aria-label="ui.switch_language" data-i18n-title="ui.switch_language"><option value="zh" data-i18n="ui.language_chinese">中文</option><option value="en">English</option></select><button id="theme" class="icon-button" aria-label="切换深浅主题" title="切换主题" data-i18n-aria-label="ui.switch_light_dark_theme" data-i18n-title="ui.switch_theme"><span data-icon="sun"></span></button></div></header>
    <main id="main" aria-live="polite"><div class="loading" data-i18n="ui.loading_workspace">正在载入工作空间…</div></main>
    <footer><span><i class="status-dot"></i><span id="footer-status" data-i18n="ui.connecting_to_local_service">正在连接本地服务</span></span><span id="footer-update" data-i18n="ui.syncing_quota_data">额度数据正在同步</span></footer>
  </div>
  <dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
