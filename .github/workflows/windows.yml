name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm run check:public
      - run: npm test
      - run: npm run build:release
      - run: node scripts/verify-artifact.js dist/portable-marketplace/plugins/codex-continuer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuer-windows-portable
          path: dist/portable-marketplace
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuer-release-with-source
          path: |
            dist/releases/**/*.zip
            dist/releases/**/*.tar.gz
            dist/releases/**/release.json
            dist/releases/**/SHA256SUMS
          retention-days: 7
